<x-dc>
<helmet>

<div style="position: relative; background: #E7EADD; overflow: hidden">
<img src="../../images/daypack-olive.jpg" alt="Transit Daypack in Olive" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block">
<span style="position: absolute; left: 28px; top: 28px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #111114; background: rgba(255,255,255,0.9); border-radius: 999px; padding: 6px 12px">No. 03 — Olive</span>
<span style="position: absolute; left: 28px; bottom: 28px; width: 56px; height: 56px; border-radius: 999px; background: #5F6B3C; box-shadow: 0 0 0 4px rgba(255,255,255,0.9)"></span>
</div>
<div style="padding: 72px 64px; display: flex; flex-direction: column; justify-content: center; gap: 24px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #5C5C69">Colour story · Custom section</span>
<h2 style="margin: 0; font-size: 48px; line-height: 1.08; font-weight: 500; letter-spacing: -0.03em">Olive, for the long way <em style="font-weight: 400">round.</em></h2>
<p style="margin: 0; font-size: 17px; color: #4A4A55; max-width: 460px">Trail-ready and a little rugged. The deep green softens with every trip, and tonal stitching lets the shape do the talking.</p>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding-top: 24px; border-top: 1px solid #ECECF1">
<div><dt style="font-size: 13px; color: #5C5C69">Finish</dt><dd style="margin: 0; font-size: 15px; font-weight: 500">Washed nylon</dd></div>
<div><dt style="font-size: 13px; color: #5C5C69">Hardware</dt><dd style="margin: 0; font-size: 15px; font-weight: 500">Matte black</dd></div>
<div><dt style="font-size: 13px; color: #5C5C69">Pairs with</dt><dd style="margin: 0; font-size: 15px; font-weight: 500">Earth tones</dd></div>
</dl>
<div role="group" aria-label="Choose colour" style="display: flex; gap: 4px; margin-left: -10px">
<button aria-label="Black" aria-pressed="false" style="width: 48px; height: 48px; border: 0; background: transparent; padding: 0; display: grid; place-items: center"><span style="width: 28px; height: 28px; border-radius: 999px; background: #1F1F22; box-shadow: inset 0 0 0 1px rgba(17,17,20,0.12)"></span></button>
<button aria-label="Sand" aria-pressed="false" style="width: 48px; height: 48px; border: 0; background: transparent; padding: 0; display: grid; place-items: center"><span style="width: 28px; height: 28px; border-radius: 999px; background: #D3BF9C; box-shadow: inset 0 0 0 1px rgba(17,17,20,0.12)"></span></button>
<button aria-label="Olive" aria-pressed="true" style="width: 48px; height: 48px; border: 0; background: transparent; padding: 0; display: grid; place-items: center"><span style="width: 28px; height: 28px; border-radius: 999px; background: #5F6B3C; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 4.5px #111114"></span></button>
</div>
</div>
